name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm run build
      - run: node scripts/check-formats.mjs
      - run: npm test
      - run: npm run lint
      - run: node scripts/copy-check.mjs
      - run: node scripts/perf.mjs --work "${{ runner.temp }}/perf" --ubuntu

  # The one check branch protection requires: it stays the same when the matrix above grows.
  ci-result:
    if: always()
    needs: build-test-lint
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.build-test-lint.result }}" = success
